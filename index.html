<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABILULUNGAN // WAR ROOM HUD</title>
    <style>
        :root {
            --bg: #09090b;
            --panel: #121215;
            --border: #27272a;
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
            --accent: #22c55e;
            --accent-dim: #14532d;
            --danger: #ef4444;
            --font-mono: 'JetBrains Mono', Consolas, Monaco, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.4;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .status-bar {
            display: flex;
            gap: 20px;
            color: var(--text-dim);
            align-items: center;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            flex: 1;
            overflow: hidden;
        }

        sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            padding: 12px 15px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
        }

        .agent-list {
            list-style: none;
        }

        .agent-item {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.1s;
        }

        .agent-item:hover {
            background: rgba(255,255,255,0.04);
        }

        .agent-item.active {
            background: var(--accent-dim);
            border-left: 3px solid var(--accent);
        }

        .agent-name {
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .agent-role {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .content-area {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .log-stream {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .log-entry {
            border: 1px solid var(--border);
            background: var(--panel);
            padding: 12px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 4px;
        }

        .log-content {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .input-panel {
            background: var(--panel);
            border-top: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 15px;
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 0 20px;
            font-family: var(--font-mono);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 4px 8px;
            font-size: 11px;
        }
        .btn-reset:hover {
            background: var(--danger);
            color: var(--bg);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SABILULUNGAN // WAR ROOM HUD v2.0</div>
        <div class="status-bar">
            <span>GATEWAY: 9ROUTER (LOCAL)</span>
            <button class="btn-reset" onclick="resetChat()">RESET MEMORY</button>
        </div>
    </header>

    <div class="main-layout">
        <sidebar>
            <div class="section-title">Active Specialists</div>
            <ul class="agent-list" id="agent-list">
                <!-- Loaded dynamically -->
            </ul>
        </sidebar>

        <div class="content-area">
            <div class="log-stream" id="log-stream">
                <div class="log-entry">
                    <div class="log-header">
                        <span>SYSTEM // INIT</span>
                        <span>[READY]</span>
                    </div>
                    <div class="log-content">Sabilulungan AI Squad online. Select a specialist from the sidebar and issue your directive.</div>
                </div>
            </div>

            <div class="input-panel">
                <input type="text" id="user-input" placeholder="Type directive..." onkeypress="handleKey(event)">
                <button onclick="sendDirective()">EXECUTE</button>
            </div>
        </div>
    </div>

    <script>
        let currentAgent = 'manager';
        let agentsData = {};

        async function loadAgents() {
            try {
                const res = await fetch('/api/agents');
                agentsData = await res.json();
                const listEl = document.getElementById('agent-list');
                listEl.textContent = '';

                for (const [role, data] of Object.entries(agentsData)) {
                    const li = document.createElement('li');
                    li.className = `agent-item ${role === currentAgent ? 'active' : ''}`;
                    li.onclick = () => selectAgent(role);
                    
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'agent-name';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = role.toUpperCase();
                    
                    const statusSpan = document.createElement('span');
                    statusSpan.style.color = 'var(--accent)';
                    statusSpan.textContent = 'ONLINE';

                    nameDiv.appendChild(nameSpan);
                    nameDiv.appendChild(statusSpan);

                    const roleDiv = document.createElement('div');
                    roleDiv.className = 'agent-role';
                    roleDiv.textContent = data.desc || (data.prompt ? data.prompt.substring(0, 40) + '...' : '');

                    li.appendChild(nameDiv);
                    li.appendChild(roleDiv);
                    listEl.appendChild(li);
                }
            } catch (e) {
                console.error("Failed to load agents", e);
            }
        }

        function selectAgent(role) {
            currentAgent = role;
            document.querySelectorAll('.agent-item').forEach(el => {
                el.classList.remove('active');
                if(el.textContent.toLowerCase().includes(role)) {
                    el.classList.add('active');
                }
            });
            appendLog('SYSTEM', `Switched context to specialist: [${role.toUpperCase()}]`);
        }

        async function sendDirective() {
            const input = document.getElementById('user-input');
            const msg = input.value.trim();
            if(!msg) return;

            input.value = '';
            appendLog('USER // DIRECTIVE', msg);

            const stream = document.getElementById('log-stream');
            const loadingId = 'load-' + Date.now();
            
            const loadDiv = document.createElement('div');
            loadDiv.className = 'log-entry';
            loadDiv.id = loadingId;
            loadDiv.innerHTML = `<div class="log-header"><span>${currentAgent.toUpperCase()} // PROCESSING</span><span>[...]</span></div><div class="log-content">Executing task...</div>`;
            stream.appendChild(loadDiv);
            stream.scrollTop = stream.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent: currentAgent, message: msg })
                });
                
                const data = await res.json();
                document.getElementById(loadingId)?.remove();

                if(data.status === 'success') {
                    appendLog(`${data.agent.toUpperCase()} // RESPONSE`, data.reply);
                } else {
                    appendLog('ERROR', data.message || 'Unknown error');
                }
            } catch (e) {
                document.getElementById(loadingId)?.remove();
                appendLog('CRITICAL', e.toString());
            }
        }

        function appendLog(header, text) {
            const stream = document.getElementById('log-stream');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            
            const head = document.createElement('div');
            head.className = 'log-header';
            
            const spanH = document.createElement('span');
            spanH.textContent = header;
            
            const spanT = document.createElement('span');
            spanT.textContent = new Date().toLocaleTimeString();
            
            head.appendChild(spanH);
            head.appendChild(spanT);

            const content = document.createElement('div');
            content.className = 'log-content';
            content.textContent = text; // XSS Safe

            entry.appendChild(head);
            entry.appendChild(content);
            stream.appendChild(entry);
            stream.scrollTop = stream.scrollHeight;
        }

        async function resetChat() {
            if(!confirm("Reset conversation memory?")) return;
            await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reset: true })
            });
            document.getElementById('log-stream').textContent = '';
            appendLog('SYSTEM', 'Memory wiped.');
        }

        function handleKey(e) {
            if(e.key === 'Enter') sendDirective();
        }

        loadAgents();
    </script>
</body>
</html>
